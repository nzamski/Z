# Dev only. The pilot uses platform-managed Postgres and the network's Keycloak.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: z
      POSTGRES_PASSWORD: z
      POSTGRES_DB: z
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./dev/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U z"]
      interval: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports: ["8180:8080"]
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro

volumes:
  pgdata:
